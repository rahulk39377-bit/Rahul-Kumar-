<!doctype html>
<html lang="hi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="मेरी समस्या">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="description" content="मेरी समस्या — अपने इलाके की नागरिक समस्याएँ दर्ज करें और स्थानीय रूप से ट्रैक करें।">
<title>मेरी समस्या | Meri Samasya</title>
<style>
:root{--p:#0d9488;--pd:#0f766e;--pl:#ccfbf1;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--red:#dc2626;--green:#15803d;--amber:#b45309;--shadow:0 3px 14px #0f172a12}
:root[data-theme=dark]{--p:#14b8a6;--pd:#5eead4;--pl:#134e4a;--bg:#0b1220;--card:#162032;--tx:#f1f5f9;--mu:#a5b4c7;--bd:#2b3a50;--shadow:0 3px 14px #0005}
*{box-sizing:border-box}html{min-height:100%;scroll-padding-top:12px}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2dd4bf;outline-offset:2px}#app{max-width:720px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:var(--pd);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px #0002}header h1{font-size:19px;line-height:1.2;margin:0;flex:1}header small{display:block;font-size:11px;opacity:.85;font-weight:500;margin-top:3px}.headbtn{border:1px solid #ffffff55;color:white;border-radius:10px;padding:8px 10px;background:#ffffff14}main{padding:14px 14px 105px;flex:1}.notice{border:1px solid #f59e0b66;background:#f59e0b14;color:var(--tx);padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.5;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 5px;text-align:center}.stat b{display:block;font-size:22px;color:var(--pd)}.stat span{font-size:11px;color:var(--mu)}.search,.inp,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:5px 0 10px;min-width:0}.row{display:flex;gap:8px;overflow:auto;padding:2px 0 9px;margin-bottom:4px}.chip{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:22px;white-space:nowrap;font-size:13px}.chip.active{background:var(--p);border-color:var(--p);color:white}.issue{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin:0 0 12px;box-shadow:var(--shadow)}.issueTop{min-height:95px;padding:14px;background:linear-gradient(135deg,#0f766e,#0e7490);color:white;position:relative}.issueTop .emoji{font-size:32px}.issueTop .tag{float:right;background:#0005;border-radius:20px;padding:4px 8px;font-size:11px}.issueBody{padding:12px 14px}.issueTitle{font-weight:750;line-height:1.4;font-size:16px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--mu);margin-top:8px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.status{font-size:11px;border-radius:20px;padding:5px 9px;white-space:nowrap;background:#fef3c7;color:#92400e}.status.progress{background:#dbeafe;color:#1d4ed8}.status.resolved{background:#dcfce7;color:#166534}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;background:var(--p);color:white;font-weight:700;padding:12px 14px;min-height:44px}.btn.secondary{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}.btn.small{padding:7px 10px;min-height:35px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.full{width:100%}.label{display:block;font-size:13px;font-weight:700;margin:10px 0 2px}.muted{color:var(--mu);font-size:12px;line-height:1.5}.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 4px;text-align:center;font-size:12px}.cat b{display:block;font-size:24px;margin-bottom:4px}.cat.active{border:2px solid var(--p);background:var(--pl);color:var(--tx)}.photoBox{border:2px dashed var(--bd);border-radius:14px;min-height:105px;display:grid;place-items:center;overflow:hidden;background:var(--card);margin:6px 0 10px;position:relative}.photoBox img{max-width:100%;max-height:240px;object-fit:contain}.switchrow,.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin:10px 0}.switchrow input{width:20px;height:20px}.empty{text-align:center;padding:42px 15px;color:var(--mu)}.empty .bigemoji{font-size:42px}.progressLine{height:7px;border-radius:9px;background:var(--bd);overflow:hidden;margin:10px 0}.progressLine span{display:block;height:100%;background:var(--p)}.detailHero{padding:22px;border-radius:16px;background:linear-gradient(135deg,#0f766e,#155e75);color:white;margin-bottom:14px}.detailHero .emoji{font-size:46px}.timeline{border-left:2px solid var(--bd);margin:18px 0 18px 8px;padding-left:18px}.timeline div{position:relative;padding:0 0 16px}.timeline div:before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--bd)}.timeline div.current:before,.timeline div.done:before{background:var(--p);box-shadow:0 0 0 3px var(--pl)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}nav button{background:transparent;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;gap:3px;align-items:center;color:var(--mu);font-size:10px}nav button span:first-child{font-size:20px}nav button.active{color:var(--p);font-weight:800}.hidden{display:none!important}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:11px 16px;border-radius:30px;z-index:10;max-width:90%;font-size:13px;box-shadow:var(--shadow)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.divider{border:0;border-top:1px solid var(--bd);margin:14px 0}.filebtn{display:inline-flex;align-items:center;justify-content:center}.foot{text-align:center;color:var(--mu);font-size:11px;padding:16px 0 0}@media(min-width:600px){main{padding:20px 22px 110px}.issueTop{min-height:110px}.stats{gap:12px}}
</style>
</head>
<body>
<div id="app">
<header><div style="font-size:27px">🏙️</div><h1 id="appTitle">मेरी समस्या<small>नागरिक समस्या रिपोर्टिंग</small></h1><button class="headbtn" id="installBtn" aria-label="Install app" hidden>⬇️</button><button class="headbtn" id="langBtn" aria-label="Change language">EN</button><button class="headbtn" id="themeBtn" aria-label="Change theme">🌙</button></header>
<main id="main"></main>
<nav id="nav" aria-label="मुख्य नेविगेशन"></nav>
</div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const STORAGE='meri_samasya_v2';
const CATS={road:{emoji:'🛣️',hi:'सड़क',en:'Road'},water:{emoji:'💧',hi:'पानी',en:'Water'},power:{emoji:'⚡',hi:'बिजली',en:'Electricity'},garbage:{emoji:'🗑️',hi:'कचरा',en:'Garbage'},light:{emoji:'💡',hi:'स्ट्रीट लाइट',en:'Street light'},other:{emoji:'🔧',hi:'अन्य',en:'Other'}};
const STATUSES={reported:{hi:'दर्ज हुई',en:'Reported'},progress:{hi:'प्रगति में',en:'In progress'},resolved:{hi:'हल हुई',en:'Resolved'}};
const TXT={
home:['होम','Home'],areas:['इलाके','Areas'],mine:['मेरी रिपोर्ट','My reports'],profile:['सेटिंग','Settings'],report:['समस्या दर्ज करें','Report issue'],
search:['समस्या या इलाका खोजें…','Search issues or area…'],all:['सभी','All'],popular:['लोकप्रिय','Popular'],latest:['नई रिपोर्ट','Latest'],
noissues:['कोई रिपोर्ट नहीं मिली','No reports found'],noMine:['आपकी रिपोर्ट यहाँ दिखेंगी।','Your reports will appear here.'],
title:['समस्या का शीर्षक','Issue title'],desc:['विवरण','Description'],area:['इलाका / पता','Area / address'],photo:['फोटो जोड़ें (वैकल्पिक)','Add photo (optional)'],category:['श्रेणी चुनें','Choose category'],
submit:['रिपोर्ट सेव करें','Save report'],gps:['📍 मेरी लोकेशन लें','📍 Use my location'],anon:['नाम छिपाएँ','Hide my name'],required:['कम-से-कम 5 अक्षर का शीर्षक और इलाका भरें।','Enter a title of at least 5 characters and an area.'],
saved:['रिपोर्ट इस डिवाइस पर सेव हुई।','Report saved on this device.'],deleted:['रिपोर्ट हटा दी गई।','Report deleted.'],confirmDelete:['क्या यह रिपोर्ट हटानी है?','Delete this report?'],support:['समर्थन','Support'],share:['शेयर करें','Share'],back:['← वापस','← Back'],export:['डेटा एक्सपोर्ट करें','Export data'],import:['बैकअप इम्पोर्ट करें','Import backup'],clear:['स्थानीय डेटा मिटाएँ','Clear local data'],clearAsk:['इस डिवाइस की सभी रिपोर्टें मिट जाएँगी। जारी रखें?','All reports on this device will be deleted. Continue?'],name:['आपका नाम','Your name'],language:['भाषा','Language'],dark:['डार्क मोड','Dark mode'],dataNote:['महत्वपूर्ण: यह संस्करण रिपोर्ट को केवल इसी डिवाइस/ब्राउज़र में रखता है। यह अपने-आप किसी सरकारी विभाग को शिकायत नहीं भेजता।','Important: this version stores reports only in this device/browser. It does not send complaints to a government department.'],demo:['उदाहरण रिपोर्टें','Sample reports'],localOnly:['स्थानीय डेमो','Local demo'],updateStatus:['स्टेटस बदलें (स्थानीय डेमो)','Change status (local demo)'],statusHelp:['यह बदलाव केवल इसी डिवाइस में दिखेगा; सरकारी पुष्टि नहीं है।','This change is only local; it is not an official update.'],photoRemove:['फोटो हटाएँ','Remove photo'],cancel:['रद्द करें','Cancel'],detail:['रिपोर्ट विवरण','Report details'],privacy:['गोपनीयता','Privacy'],backupOk:['बैकअप फ़ाइल तैयार है।','Backup file is ready.'],importOk:['बैकअप इम्पोर्ट हो गया।','Backup imported.'],invalidFile:['यह बैकअप फ़ाइल मान्य नहीं है।','This backup file is invalid.'],emptyData:['अभी कोई रिपोर्ट नहीं है।','There are no reports yet.']
};
let lang='hi',theme='light',page='home',selectedCat='road',photoData='',searchText='',filterCat='all',sort='popular',currentId=null,toastTimer=null;
let profile={name:'मेरे उपयोगकर्ता'};
let reports=[];
const tr=k=>TXT[k]?.[lang==='hi'?0:1]||k;
const catName=k=>CATS[k]?.[lang]||CATS.other[lang];
const statusName=k=>STATUSES[k]?.[lang]||STATUSES.reported[lang];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),2600)}
function readStore(){try{const d=JSON.parse(localStorage.getItem(STORAGE)||'null');if(d&&Array.isArray(d.reports)){reports=d.reports;profile=d.profile||profile;lang=d.lang||lang;theme=d.theme||theme;return true}}catch(e){}return false}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({reports,profile,lang,theme}));return true}catch(e){notify(lang==='hi'?'सेव नहीं हुआ। फोटो हटाकर या बैकअप लेकर फिर कोशिश करें।':'Could not save. Remove the photo or export a backup and try again.');return false}}
function seed(){const now=Date.now();return[
{id:'sample-1',category:'road',title:{hi:'मार्केट के पास सड़क पर बड़ा गड्ढा',en:'Large pothole near the market'},description:{hi:'यह केवल उदाहरण रिपोर्ट है, वास्तविक शिकायत नहीं।',en:'This is a sample report, not a real complaint.'},area:'उदाहरण इलाका',createdAt:now-86400000,status:'progress',votes:3,voted:false,mine:false,anonymous:true,sample:true,photo:''},
{id:'sample-2',category:'water',title:{hi:'पानी की सप्लाई की समस्या',en:'Water supply issue'},description:{hi:'उदाहरण के लिए जोड़ी गई रिपोर्ट।',en:'A report added as an example.'},area:'उदाहरण इलाका',createdAt:now-3600000,status:'reported',votes:1,voted:false,mine:false,anonymous:true,sample:true,photo:''}
]}
function textVal(v){return typeof v==='object'&&v?v[lang==='hi'?'hi':'en']??'':String(v??'')}
function timeAgo(ts){const m=Math.max(1,Math.floor((Date.now()-Number(ts||Date.now()))/60000));if(m<60)return lang==='hi'?`${m} मिनट पहले`:`${m} min ago`;const h=Math.floor(m/60);if(h<24)return lang==='hi'?`${h} घंटे पहले`:`${h} h ago`;const d=Math.floor(h/24);return lang==='hi'?`${d} दिन पहले`:`${d} d ago`}
function safeReports(){return reports.filter(r=>r&&r.id&&r.category&&r.title)}
function statusPill(s){return `<span class="status ${s==='progress'?'progress':s==='resolved'?'resolved':''}">${esc(statusName(s))}</span>`}
function navRender(){const items=[['home','🏠',tr('home')],['areas','🗺️',tr('areas')],['report','➕',tr('report')],['mine','📋',tr('mine')],['profile','⚙️',tr('profile')]];$('#nav').innerHTML=items.map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span><span>${esc(label)}</span></button>`).join('')}
function notice(){return `<div class="notice">ℹ️ ${esc(tr('dataNote'))}</div>`}
function stats(){const real=safeReports().filter(r=>!r.sample);return `<div class="stats"><div class="stat"><b>${real.length}</b><span>${lang==='hi'?'कुल रिपोर्ट':'Total reports'}</span></div><div class="stat"><b>${real.filter(r=>r.status==='progress').length}</b><span>${esc(statusName('progress'))}</span></div><div class="stat"><b>${real.filter(r=>r.status==='resolved').length}</b><span>${esc(statusName('resolved'))}</span></div></div>`}
function card(r){const title=textVal(r.title);return `<article class="issue"><div class="issueTop"><span class="tag">${r.sample?esc(tr('demo')):esc(catName(r.category))}</span><div class="emoji">${CATS[r.category]?.emoji||'🔧'}</div><div style="font-size:12px;margin-top:5px">${esc(catName(r.category))}</div></div><div class="issueBody"><div class="issueTitle">${esc(title)}</div><div class="meta"><span>📍 ${esc(r.area)} · ${esc(timeAgo(r.createdAt))}</span>${statusPill(r.status)}</div><div class="actions"><button class="btn secondary small" data-detail="${esc(r.id)}">${lang==='hi'?'विवरण देखें':'View details'}</button><button class="btn secondary small" data-vote="${esc(r.id)}" ${r.sample?'disabled':''}>👍 ${Number(r.votes)||0}</button></div></div></article>`}
function homeView(){const list=safeReports().filter(r=>(filterCat==='all'||r.category===filterCat)&&(!searchText||(textVal(r.title)+' '+textVal(r.description)+' '+r.area).toLowerCase().includes(searchText.toLowerCase()))).sort((a,b)=>sort==='popular'?(Number(b.votes)||0)-(Number(a.votes)||0):(b.createdAt||0)-(a.createdAt||0));return `${notice()}${stats()}<input class="search" id="search" value="${esc(searchText)}" placeholder="${esc(tr('search'))}" aria-label="${esc(tr('search'))}"><div class="row"><button class="chip ${filterCat==='all'?'active':''}" data-catfilter="all">${esc(tr('all'))}</button>${Object.entries(CATS).map(([k,c])=>`<button class="chip ${filterCat===k?'active':''}" data-catfilter="${k}">${c.emoji} ${esc(c[lang])}</button>`).join('')}</div><div class="row"><button class="chip ${sort==='popular'?'active':''}" data-sort="popular">🔥 ${esc(tr('popular'))}</button><button class="chip ${sort==='latest'?'active':''}" data-sort="latest">🕒 ${esc(tr('latest'))}</button></div>${list.length?list.map(card).join(''):`<div class="empty"><div class="bigemoji">🔎</div>${esc(tr('noissues'))}</div>`}<div class="muted">${esc(tr('demo'))}: नमूना रिपोर्टें केवल ऐप का प्रदर्शन दिखाने के लिए हैं।</div>`}
function areasView(){const map={};safeReports().filter(r=>!r.sample).forEach(r=>{map[r.area]??={total:0,open:0};map[r.area].total++;if(r.status!=='resolved')map[r.area].open++});const rows=Object.entries(map).sort((a,b)=>b[1].open-a[1].open);if(!rows.length)return `${notice()}<div class="empty"><div class="bigemoji">🗺️</div>${esc(tr('emptyData'))}</div>`;const max=Math.max(1,...rows.map(x=>x[1].open));return `${notice()}<h2 style="font-size:17px">${lang==='hi'?'इलाकेवार रिपोर्ट':'Reports by area'}</h2>${rows.map(([area,v])=>`<article class="issue issueBody"><b>📍 ${esc(area)}</b><div class="meta"><span>${v.open} ${lang==='hi'?'खुली':'open'} / ${v.total} ${lang==='hi'?'कुल':'total'}</span></div><div class="progressLine"><span style="width:${Math.round(v.open/max*100)}%"></span></div><button class="btn secondary small" data-area="${esc(area)}">${lang==='hi'?'इस इलाके की रिपोर्ट देखें':'View area reports'}</button></article>`).join('')}`}
function mineView(){const list=safeReports().filter(r=>r.mine&&!r.sample).sort((a,b)=>b.createdAt-a.createdAt);return `${notice()}<h2 style="font-size:18px;margin:0 0 12px">${esc(tr('mine'))}</h2>${list.length?list.map(card).join(''):`<div class="empty"><div class="bigemoji">📋</div>${esc(tr('noMine'))}<p><button class="btn" data-page="report">${esc(tr('report'))}</button></p></div>`}`}
function reportView(){return `${notice()}<form id="reportForm"><label class="label">${esc(tr('category'))}</label><div class="cats">${Object.entries(CATS).map(([k,c])=>`<button type="button" class="cat ${selectedCat===k?'active':''}" data-selectcat="${k}"><b>${c.emoji}</b>${esc(c[lang])}</button>`).join('')}</div><label class="label" for="rtitle">${esc(tr('title'))} *</label><input class="inp" id="rtitle" name="title" required minlength="5" maxlength="90" placeholder="${lang==='hi'?'जैसे: गली की नाली जाम है':'e.g. Drain blocked on our street'}"><label class="label" for="rdesc">${esc(tr('desc'))}</label><textarea class="inp" id="rdesc" name="description" rows="4" maxlength="1000" placeholder="${lang==='hi'?'समस्या का विवरण लिखें…':'Describe the issue…'}"></textarea><label class="label" for="rarea">${esc(tr('area'))} *</label><input class="inp" id="rarea" name="area" required maxlength="100" placeholder="${lang==='hi'?'मोहल्ला, गाँव, वार्ड या सड़क':'Locality, village, ward or street'}"><button type="button" class="btn secondary full" id="gpsBtn">${esc(tr('gps'))}</button><label class="label">${esc(tr('photo'))}</label><div class="photoBox" id="photoBox"><span>📷 ${esc(tr('photo'))}</span></div><input class="inp" type="file" id="photoInput" accept="image/*" capture="environment"><div class="muted">${lang==='hi'?'फोटो आपके डिवाइस में सेव होगी। बेहतर है कि फोटो में निजी जानकारी न हो।':'The photo is stored on this device. Avoid including private information.'}</div><label class="switchrow"><span>${esc(tr('anon'))}</span><input type="checkbox" id="anonymous" checked></label><button class="btn full" type="submit">${esc(tr('submit'))}</button></form>`}
function detailView(){const r=safeReports().find(x=>String(x.id)===String(currentId));if(!r)return `<button class="btn secondary" data-page="home">${esc(tr('back'))}</button><p>${esc(tr('noissues'))}</p>`;const order=['reported','progress','resolved'],ix=order.indexOf(r.status);return `${notice()}<div class="detailHero"><div class="emoji">${CATS[r.category]?.emoji||'🔧'}</div><div style="font-size:12px;margin-top:6px">${esc(catName(r.category))}</div></div><div class="issueTitle" style="font-size:20px">${esc(textVal(r.title))}</div><div class="meta"><span>📍 ${esc(r.area)}</span>${statusPill(r.status)}</div>${r.photo?`<div class="photoBox"><img src="${r.photo}" alt="${lang==='hi'?'रिपोर्ट की फोटो':'Report photo'}"></div>`:''}<p style="white-space:pre-wrap;line-height:1.65;margin-top:14px">${esc(textVal(r.description)|| (lang==='hi'?'कोई अतिरिक्त विवरण नहीं।':'No additional description.'))}</p><div class="muted" style="margin-top:8px">${lang==='hi'?'दर्ज किया गया':'Created'}: ${esc(new Date(r.createdAt).toLocaleString(lang==='hi'?'hi-IN':'en-IN'))}</div><div class="timeline">${order.map((s,i)=>`<div class="${i<ix?'done':i===ix?'current':''}"><b>${esc(statusName(s))}</b>${i===0?`<div class="muted">${esc(new Date(r.createdAt).toLocaleString(lang==='hi'?'hi-IN':'en-IN'))}</div>`:''}</div>`).join('')}</div>${r.sample?`<div class="notice">${esc(tr('demo'))} — इसे वास्तविक शिकायत न समझें।</div>`:`<div class="notice">${esc(tr('statusHelp'))}</div><label class="label">${esc(tr('updateStatus'))}</label><select id="statusSelect">${order.map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${esc(statusName(s))}</option>`).join('')}</select><button class="btn full" data-updatestatus="${esc(r.id)}">${lang==='hi'?'स्थानीय स्टेटस सेव करें':'Save local status'}</button><div class="actions"><button class="btn secondary full" data-share="${esc(r.id)}">${esc(tr('share'))}</button><button class="btn danger full" data-delete="${esc(r.id)}">${lang==='hi'?'हटाएँ':'Delete'}</button></div>`}`}
function profileView(){return `${notice()}<h2 style="font-size:18px">${esc(tr('profile'))}</h2><label class="label" for="profileName">${esc(tr('name'))}</label><input class="inp" id="profileName" maxlength="40" value="${esc(profile.name||'')}"><button class="btn full" id="saveProfile">${lang==='hi'?'नाम सेव करें':'Save name'}</button><div class="setting"><span>${esc(tr('language'))}</span><button class="btn secondary small" id="toggleLang">${lang==='hi'?'हिंदी':'English'}</button></div><div class="setting"><span>${esc(tr('dark'))}</span><input type="checkbox" id="darkToggle" ${theme==='dark'?'checked':''}></div><hr class="divider"><h3 style="font-size:15px">${lang==='hi'?'बैकअप और डेटा':'Backup and data'}</h3><p class="muted">${lang==='hi'?'डेटा केवल इस ब्राउज़र/डिवाइस में रहता है। ऐप डेटा साफ करने या फोन बदलने से पहले बैकअप डाउनलोड करें।':'Data stays in this browser/device. Download a backup before clearing app data or changing phones.'}</p><div class="actions"><button class="btn full" id="exportBtn">${esc(tr('export'))}</button><button class="btn secondary full" id="importBtn">${esc(tr('import'))}</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><button class="btn danger full" id="clearBtn" style="margin-top:12px">${esc(tr('clear'))}</button><div class="foot">Meri Samasya · v2.0 · Offline/local prototype</div>`}
function render(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;$('#langBtn').textContent=lang==='hi'?'EN':'हिंदी';$('#themeBtn').textContent=theme==='dark'?'☀️':'🌙';$('#appTitle').innerHTML=`${lang==='hi'?'मेरी समस्या':'Meri Samasya'}<small>${lang==='hi'?'नागरिक समस्या रिपोर्टिंग':'Community issue reporting'}</small>`;const views={home:homeView,areas:areasView,mine:mineView,report:reportView,profile:profileView,detail:detailView};$('#main').innerHTML=(views[page]||homeView)();navRender()}
function go(p,id){page=p;if(id!==undefined)currentId=id;render();window.scrollTo(0,0);$('#main').scrollTop=0}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return resolve('');const reader=new FileReader();reader.onerror=()=>reject(new Error('read'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('image'));img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');if(!ctx)return reject(new Error('canvas'));ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68))};img.src=reader.result};reader.readAsDataURL(file)})}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$('#main').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page){go(b.dataset.page);return}
if(b.dataset.selectcat){selectedCat=b.dataset.selectcat;render();return}
if(b.dataset.catfilter){filterCat=b.dataset.catfilter;render();return}
if(b.dataset.sort){sort=b.dataset.sort;render();return}
if(b.dataset.detail){go('detail',b.dataset.detail);return}
if(b.dataset.vote){const r=reports.find(x=>String(x.id)===b.dataset.vote);if(r&&!r.sample){r.voted=!r.voted;r.votes=Math.max(0,(Number(r.votes)||0)+(r.voted?1:-1));persist();render()}return}
if(b.dataset.area){searchText=b.dataset.area;page='home';render();$('#search').value=searchText;return}
if(b.dataset.delete){if(confirm(tr('confirmDelete'))){reports=reports.filter(r=>String(r.id)!==b.dataset.delete);persist();notify(tr('deleted'));go('mine')}return}
if(b.dataset.updatestatus){const r=reports.find(x=>String(x.id)===b.dataset.updatestatus);const s=$('#statusSelect')?.value;if(r&&['reported','progress','resolved'].includes(s)){r.status=s;persist();notify(lang==='hi'?'स्थानीय स्टेटस सेव हुआ।':'Local status saved.');render()}return}
if(b.dataset.share){const r=reports.find(x=>String(x.id)===b.dataset.share);if(r){const msg=`${textVal(r.title)}\n📍 ${r.area}\n${lang==='hi'?'स्थिति':'Status'}: ${statusName(r.status)}\n— Meri Samasya`;try{if(navigator.share)await navigator.share({title:'Meri Samasya',text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);notify(lang==='hi'?'विवरण कॉपी हुआ।':'Details copied.')}else notify(msg)}catch(err){}}return}
});
$('#main').addEventListener('input',e=>{if(e.target.id==='search'){searchText=e.target.value;const pos=e.target.selectionStart;const y=$('#main').scrollTop;const html=homeView();const temp=document.createElement('div');temp.innerHTML=html;const issueList=temp.querySelectorAll('.issue');const current=$('#main');const old=current.querySelectorAll('.issue');/* preserve search focus by updating only list */const listReports=safeReports().filter(r=>(filterCat==='all'||r.category===filterCat)&&(!searchText||(textVal(r.title)+' '+textVal(r.description)+' '+r.area).toLowerCase().includes(searchText.toLowerCase()))).sort((a,b)=>sort==='popular'?(Number(b.votes)||0)-(Number(a.votes)||0):(b.createdAt||0)-(a.createdAt||0));const marker=[...current.querySelectorAll('.issue')];marker.forEach(n=>n.remove());const search=current.querySelector('#search');let anchor=search;const row=search?.nextElementSibling?.nextElementSibling;if(row){let insert=row.nextElementSibling;while(insert&&insert.classList.contains('issue')){const next=insert.nextElementSibling;insert.remove();insert=next}const htmlList=listReports.length?listReports.map(card).join(''):`<div class="empty"><div class="bigemoji">🔎</div>${esc(tr('noissues'))}</div>`;row.insertAdjacentHTML('afterend',htmlList)}if(search){search.focus();search.setSelectionRange(pos,pos)}current.scrollTop=y}});
$('#main').addEventListener('change',async e=>{if(e.target.id==='photoInput'){const file=e.target.files?.[0];if(!file)return;if(file.size>12*1024*1024){notify(lang==='hi'?'फोटो 12 MB से छोटी चुनें।':'Choose a photo under 12 MB.');e.target.value='';return}try{photoData=await compressImage(file);$('#photoBox').innerHTML=photoData?`<img src="${photoData}" alt="Preview"><button type="button" class="btn danger small" id="removePhoto" style="position:absolute;bottom:6px;right:6px">${esc(tr('photoRemove'))}</button>`:'📷'}catch(err){notify(lang==='hi'?'फोटो पढ़ नहीं पाए।':'Could not read photo.')}return}
if(e.target.id==='darkToggle'){theme=e.target.checked?'dark':'light';persist();render()}});
$('#main').addEventListener('click',e=>{if(e.target.id==='removePhoto'){photoData='';$('#photoBox').innerHTML=`<span>📷 ${esc(tr('photo'))}</span>`;$('#photoInput').value=''}});
$('#main').addEventListener('submit',async e=>{if(e.target.id!=='reportForm')return;e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),area=String(fd.get('area')||'').trim();if(title.length<5||!area){notify(tr('required'));return}const r={id:`r-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,category:selectedCat,title,description:String(fd.get('description')||'').trim(),area,createdAt:Date.now(),status:'reported',votes:0,voted:false,mine:true,anonymous:$('#anonymous').checked,photo:photoData,sample:false};reports.unshift(r);if(persist()){photoData='';searchText='';filterCat='all';sort='latest';notify(tr('saved'));go('mine')}});
$('#main').addEventListener('click',async e=>{if(e.target.id==='gpsBtn'){if(!navigator.geolocation){notify(lang==='hi'?'इस ब्राउज़र में लोकेशन उपलब्ध नहीं।':'Geolocation unavailable.');return}e.target.disabled=true;navigator.geolocation.getCurrentPosition(p=>{const el=$('#rarea');if(el)el.value=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;e.target.disabled=false},()=>{notify(lang==='hi'?'लोकेशन अनुमति नहीं मिली।':'Location permission denied.');e.target.disabled=false},{enableHighAccuracy:false,timeout:10000,maximumAge:60000});return}
if(e.target.id==='saveProfile'){profile.name=($('#profileName')?.value||'').trim().slice(0,40)||'मेरे उपयोगकर्ता';persist();notify(lang==='hi'?'नाम सेव हुआ।':'Name saved.');return}
if(e.target.id==='toggleLang'){lang=lang==='hi'?'en':'hi';persist();render();return}
if(e.target.id==='exportBtn'){const blob=new Blob([JSON.stringify({app:'Meri Samasya',version:2,exportedAt:new Date().toISOString(),reports,profile,lang,theme},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='meri-samasya-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(tr('backupOk'));return}
if(e.target.id==='importBtn'){$('#importFile').click();return}
if(e.target.id==='clearBtn'){if(confirm(tr('clearAsk'))){reports=[];persist();notify(lang==='hi'?'स्थानीय डेटा मिटा दिया गया।':'Local data cleared.');go('home')}return}
});
$('#main').addEventListener('change',e=>{if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d||!Array.isArray(d.reports)||d.reports.some(r=>!r||!r.id||!r.category||!r.title||!['reported','progress','resolved'].includes(r.status)))throw Error('invalid');reports=d.reports;profile=d.profile||profile;lang=d.lang==='en'?'en':'hi';theme=d.theme==='dark'?'dark':'light';persist();notify(tr('importOk'));go('home')}catch(err){notify(tr('invalidFile'))}};reader.readAsText(f);e.target.value=''}});
$('#langBtn').addEventListener('click',()=>{lang=lang==='hi'?'en':'hi';persist();render()});
$('#themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';persist();render()});
const hasSavedStore=readStore();if(!hasSavedStore){reports=seed();persist()}render();
})();
</script>
<script>
// PWA support: install prompt where supported and offline app-shell caching.
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('Service worker registration failed:', err); });
    });
  }
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function(event){
    event.preventDefault(); deferredPrompt = event;
    if (installBtn) installBtn.hidden = false;
  });
  if (installBtn) {
    installBtn.addEventListener('click', async function(){
      if (!deferredPrompt) {
        alert('Chrome मेनू (⋮) खोलें और “Install app” या “Add to Home screen” चुनें।');
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null; installBtn.hidden = true;
    });
  }
  window.addEventListener('appinstalled', function(){ if (installBtn) installBtn.hidden = true; });
})();
</script>
</body></html>
